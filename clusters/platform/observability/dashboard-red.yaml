# Shared RED dashboard for every ParcelPigeon service. Grafana's sidecar loads
# any ConfigMap labelled grafana_dashboard: "1" — edit the JSON here (or in the
# UI, then Export → JSON and paste it back), never only in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: parcelpigeon-red-dashboard
  labels:
    grafana_dashboard: "1"
data:
  parcelpigeon-red.json: |
    {
      "uid": "parcelpigeon-red",
      "title": "ParcelPigeon RED",
      "tags": [
        "parcelpigeon"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(http_requests_total, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(http_requests_total, namespace)",
            "refresh": 2,
            "current": {
              "text": "parcelpigeon-dev",
              "value": "parcelpigeon-dev"
            }
          },
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(http_requests_total{namespace=\"$namespace\"}, service)",
              "refId": "svc"
            },
            "definition": "label_values(http_requests_total{namespace=\"$namespace\"}, service)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "search",
            "label": "Log search",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Rollouts",
            "enable": true,
            "iconColor": "purple",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "changes(kube_replicaset_created{namespace=\"$namespace\"}[1m]) > 0",
            "titleFormat": "new ReplicaSet",
            "textFormat": "{{replicaset}}",
            "step": "30s"
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Is everything OK? (RED, without /metrics and probes)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Errors (5xx share)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\", status=~\"5..\"}[$__rate_interval])) / sum(rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latency p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval])))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 101,
          "type": "row",
          "title": "Details",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests / s by service and status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service, status) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))",
              "legendFormat": "{{service}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Errors (5xx share) by service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\", status=~\"5..\"}[$__rate_interval])) / sum by (service) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p95 by route",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service, route, path) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", service=~\"$service\", route!~\"/metrics|/healthz|/readyz\", path!~\"/metrics|/healthz|/readyz\"}[$__rate_interval])))",
              "legendFormat": "{{service}} {{route}}{{path}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Gateway: stable vs canary (5xx share)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (rollouts_pod_template_hash) (rate(http_requests_total{namespace=\"$namespace\", service=\"gateway\", route=~\"/api/.*\", status=~\"5..\"}[$__rate_interval])) / sum by (rollouts_pod_template_hash) (rate(http_requests_total{namespace=\"$namespace\", service=\"gateway\", route=~\"/api/.*\"}[$__rate_interval]))",
              "legendFormat": "pod-template-hash {{rollouts_pod_template_hash}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "description": "What the gateway-success-rate AnalysisTemplate looks at during a canary: one line per ReplicaSet."
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Business events / min",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(shipments_created_total{namespace=\"$namespace\"}[$__rate_interval])) * 60",
              "legendFormat": "shipments created"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(shipment_status_changed_total{namespace=\"$namespace\"}[$__rate_interval])) * 60",
              "legendFormat": "status → {{status}}"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(tracking_notifications_sent_total{namespace=\"$namespace\"}[$__rate_interval])) * 60",
              "legendFormat": "notifications sent"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Saturation: container CPU (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Logs (Loki)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"$namespace\", app=~\"$service\"} |~ \"$search\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "sortOrder": "Descending"
          }
        }
      ]
    }
