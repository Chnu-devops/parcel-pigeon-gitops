# Our own monitoring config that isn't tied to one service: the shared
# "ParcelPigeon RED" Grafana dashboard (clusters/platform/observability/).
# Per-service ServiceMonitors and alert rules live in each app chart instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parcelpigeon-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Chnu-devops/parcel-pigeon-gitops.git
    targetRevision: main
    path: clusters/platform/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
