{{- if .Values.monitoring.enabled }}
# Alerts on symptoms users feel, not on causes like CPU. Evaluated by
# Prometheus, delivered (grouped, silenced) by Alertmanager.
# Scoped to this release's namespace, so dev and prod alert separately.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tracking-service
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "tracking-service" "ctx" $) | nindent 4 }}
spec:
  groups:
    - name: tracking-service
      rules:
        - alert: TrackingServiceHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", service="tracking-service", status=~"5.."}[2m]))
            / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", service="tracking-service"}[2m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "tracking-service in {{ .Release.Namespace }}: more than 5% of requests fail"
            description: "{{ "{{" }} $value | humanizePercentage {{ "}}" }} of tracking-service requests answer 5xx. Check the ParcelPigeon RED dashboard, then the logs: {namespace=\"{{ .Release.Namespace }}\", app=\"tracking-service\"} |= \"error\""
        # absent(… == 1): fires both when the pod is there but /metrics doesn't
        # answer and when there is no pod at all (scaled to 0, crash-looping).
        - alert: TrackingServiceDown
          expr: absent(up{namespace="{{ .Release.Namespace }}", service="tracking-service"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "tracking-service in {{ .Release.Namespace }}: no healthy pod for 1 minute"
            description: "Prometheus can't scrape any tracking-service pod. kubectl -n {{ .Release.Namespace }} get pods -l app=tracking-service"
{{- end }}
