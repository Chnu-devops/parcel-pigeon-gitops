# Default values for the gateway chart.

image:
  repository: ghcr.io/chnu-devops/gateway
  tag: latest
replicas: 1
port: 8000
config:
  PORT: "8000"
  HOST: "0.0.0.0"
  SHIPMENTS_URL: "http://shipments-service:8000"
  TRACKING_URL: "http://tracking-service:8002"
  LOG_LEVEL: "info"
secret:
  GATEWAY_API_KEY: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Canary steps (Argo Rollouts). Default = dev: half the pods on the new version,
# check them with the gateway-readyz analysis, then go to 100% on success —
# no human in the loop. Prod replaces the whole list in its overlay
# (Helm replaces lists, it doesn't merge them).
rollout:
  steps:
    - setWeight: 50
    - analysis:
        templates:
          - templateName: gateway-readyz
