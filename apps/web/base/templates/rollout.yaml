# A Rollout is a Deployment with a release strategy: same selector and pod
# template, plus `strategy.blueGreen`. Argo Rollouts (clusters/platform/) runs it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "web" "ctx" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "parcelpigeon.selectorLabels" "web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parcelpigeon.labels" (dict "name" "web" "ctx" $) | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  strategy:
    blueGreen:
      # The new version starts next to the old one at full size and gets only
      # `web-preview`. Promotion re-points `web` (and so the Ingress) at it in
      # one step; the old pods stay for scaleDownDelaySeconds for a quick abort.
      activeService: web
      previewService: web-preview
      autoPromotionEnabled: {{ .Values.rollout.autoPromotionEnabled }}
      scaleDownDelaySeconds: 30
