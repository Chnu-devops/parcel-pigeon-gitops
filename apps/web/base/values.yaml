# Default values for the web chart.

image:
  repository: ghcr.io/chnu-devops/web
  tag: latest
replicas: 1
port: 8080
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: parcelpigeon.local

# Blue-green (Argo Rollouts). Default = dev: switch to the new version as soon
# as its pods are ready. Prod turns this off and waits for `promote`.
rollout:
  autoPromotionEnabled: true
