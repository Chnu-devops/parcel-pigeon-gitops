apiVersion: v1
kind: Service
metadata:
  name: shipments-service
  labels:
    {{- include "parcelpigeon.labels" (dict "name" "shipments-service" "ctx" $) | nindent 4 }}
spec:
  selector:
    {{- include "parcelpigeon.selectorLabels" "shipments-service" | nindent 4 }}
  ports:
    - name: http # ServiceMonitor picks the endpoint by port name
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
